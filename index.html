<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Super Camper Studio V8</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Battambang:wght@300;400;700&family=Koulen&family=Moul&display=swap" rel="stylesheet">
</head>

<body>

<!-- =========================
TOP TOOLBAR
========================= -->

<header class="toolbar">

    <div class="logo">
        🏕️ Super Camper Studio V8
    </div>

    <div class="toolbar-actions">

        <button id="undoBtn">↶ Undo</button>
        <button id="redoBtn">↷ Redo</button>

        <button id="addTextBtn">➕ Add Text</button>

        <button id="duplicateBtn">📑 Duplicate</button>
        <button id="deleteBtn">🗑 Delete</button>

        <button id="saveBtn">💾 Save</button>

        <label class="file-btn">
            📂 Load
            <input type="file" id="loadProject" hidden>
        </label>

        <button id="exportPNG">🖼 PNG</button>
        <button id="exportPDF">📄 PDF</button>
        <button id="printBtn">🖨 Print</button>

    </div>

</header>

<!-- =========================
MAIN LAYOUT
========================= -->

<div class="studio">

    <!-- =====================
    LEFT SIDEBAR
    ====================== -->

    <aside class="sidebar">

        <!-- Templates -->

        <div class="panel">

            <h3>🎨 Templates</h3>

            <select id="templateSelect">

                <option value="ក្រហម.png">ក្រហម</option>
                <option value="បៃតង.png">បៃតង</option>
                <option value="លឿង.png">លឿង</option>
                <option value="ស្វាយ.png">ស្វាយ</option>
                <option value="ផ្កាឈូក.png">ផ្កាឈូក</option>
                <option value="ខៀវ.png">ខៀវ</option>

            </select>

        </div>

        <!-- Background -->

        <div class="panel">

            <h3>🖼 Background</h3>

            <input
                type="file"
                id="backgroundUpload"
                accept="image/*">

        </div>

        <!-- Photo -->

        <div class="panel">

            <h3>📷 Photo</h3>

            <input
                type="file"
                id="photoUpload"
                accept="image/*">

        </div>

        <!-- Text -->

        <div class="panel">

            <h3>📝 Text Content</h3>

            <input
                type="text"
                id="nameInput"
                placeholder="ឈ្មោះ">

            <textarea
                id="reasonInput"
                rows="4"
                placeholder="មូលហេតុ">
            </textarea>

            <input
                type="text"
                id="groupInput"
                placeholder="ក្រុម">

        </div>

        <!-- Layers -->

        <div class="panel">

            <h3>📚 Layers</h3>

            <div id="layersPanel">

            </div>

        </div>

    </aside>

    <!-- =====================
    CENTER WORKSPACE
    ====================== -->

    <main class="workspace">

        <div id="canvas">

            <!-- Background -->

            <img
                id="backgroundImage"
                class="background-image"
                src="បៃតង.png">

            <!-- Photo -->

            <img
                id="photo"
                class="draggable photo-item">

            <!-- Name -->

            <div
                id="nameText"
                class="draggable text-item selected">

                ឈ្មោះអ្នកទទួល

                <span class="resize-handle"></span>

            </div>

            <!-- Reason -->

            <div
                id="reasonText"
                class="draggable text-item">

                មូលហេតុទទួលវិញ្ញាបនបត្រ

                <span class="resize-handle"></span>

            </div>

            <!-- Group -->

            <div
                id="groupText"
                class="draggable text-item">

                ក្រុម

                <span class="resize-handle"></span>

            </div>

        </div>

    </main>

    <!-- =====================
    RIGHT PROPERTIES
    ====================== -->

    <aside class="properties">

        <!-- Object -->

        <div class="panel">

            <h3>🎯 Selected Object</h3>

            <select id="selectedText">

                <option value="nameText">Name</option>
                <option value="reasonText">Reason</option>
                <option value="groupText">Group</option>

            </select>

        </div>

        <!-- Font -->

        <div class="panel">

            <h3>🔤 Font</h3>

            <label>Font Family</label>

            <select id="fontFamily">

                <option value="Battambang">Battambang</option>
                <option value="Koulen">Koulen</option>
                <option value="Moul">Moul</option>

                <option value="Arial">Arial</option>
                <option value="Tahoma">Tahoma</option>
                <option value="Verdana">Verdana</option>

            </select>

            <label>Font Size</label>

            <input
                type="range"
                id="fontSize"
                min="10"
                max="150"
                value="50">

        </div>

        <!-- Colors -->

        <div class="panel">

            <h3>🎨 Colors</h3>

            <label>Text Color</label>

            <input
                type="color"
                id="textColor"
                value="#ffffff">

            <label>Shadow Color</label>

            <input
                type="color"
                id="shadowColor"
                value="#000000">

        </div>

        <!-- Style -->

        <div class="panel">

            <h3>✨ Style</h3>

            <label>

                <input
                    type="checkbox"
                    id="boldText">

                Bold

            </label>

            <label>

                <input
                    type="checkbox"
                    id="italicText">

                Italic

            </label>

        </div>

        <!-- Photo -->

        <div class="panel">

            <h3>📷 Photo Settings</h3>

            <label>Photo Size</label>

            <input
                type="range"
                id="photoSize"
                min="80"
                max="600"
                value="180">

            <label>Border Radius</label>

            <input
                type="range"
                id="photoRadius"
                min="0"
                max="100"
                value="10">

        </div>

        <!-- Position -->

        <div class="panel">

            <h3>📍 Position</h3>

            <label>X Position</label>

            <input
                type="range"
                id="xPos"
                min="0"
                max="794">

            <label>Y Position</label>

            <input
                type="range"
                id="yPos"
                min="0"
                max="1123">

        </div>

    </aside>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="app.js"></script>

</body>
</html>
