<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Camper Studio V11 Pro Max</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Top Toolbar -->
    <header class="toolbar">
        <h1>Super Camper Studio</h1>

        <div class="toolbar-actions">

            <button id="addTextBtn">Text</button>

            <button id="addImageBtn">Photo</button>

            <button id="addStickerBtn">Sticker</button>

            <button id="templateBtn">Template</button>

            <button id="undoBtn">Undo</button>

            <button id="redoBtn">Redo</button>

            <button id="exportBtn">Export PNG</button>

        </div>
    </header>

    <!-- Main Layout -->
    <main class="studio-layout">

        <!-- Left Panel -->
        <aside class="sidebar">

            <h3>Fonts</h3>

            <select id="fontSelect">
                <option>Loading Fonts...</option>
            </select>

            <h3>Font Size</h3>

            <input
                type="range"
                id="fontSize"
                min="10"
                max="150"
                value="40"
            >

            <h3>Text Color</h3>

            <input
                type="color"
                id="textColor"
                value="#000000"
            >

            <h3>Templates</h3>

            <div id="templateLibrary"></div>

            <h3>Stickers</h3>

            <div id="stickerLibrary"></div>

        </aside>

        <!-- Canvas Area -->
        <section class="canvas-wrapper">

            <canvas
                id="designCanvas"
                width="1080"
                height="1080">
            </canvas>

        </section>

        <!-- Right Panel -->
        <aside class="layers-panel">

            <h3>Layers</h3>

            <div id="layerList"></div>

        </aside>

    </main>

    <script src="app.js"></script>

</body>
</html>
