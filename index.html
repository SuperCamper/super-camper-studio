<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Super Camper Studio V9 Pro</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Battambang:wght@300;400;700&family=Koulen&family=Moul&display=swap" rel="stylesheet">
</head>
<body>

<header class="toolbar">

    <div class="logo">
        🏕️ Super Camper Studio V9 Pro
    </div>

    <div class="toolbar-actions">
        <button id="saveBtn">💾 Save</button>
        <button id="loadBtn">📂 Load</button>
        <button id="exportPNG">🖼 PNG</button>
        <button id="exportPDF">📄 PDF</button>
        <button id="printBtn">🖨 Print</button>
    </div>

</header>

<div class="container">

    <!-- LEFT SIDEBAR -->
    <aside class="left-panel">

        <div class="panel">
            <h3>🎨 Templates</h3>

            <select id="templateSelect">
                <option value="ក្រហម.png">ក្រហម</option>
                <option value="បៃតង.png">បៃតង</option>
                <option value="លឿង.png">លឿង</option>
                <option value="ស្វាយ.png">ស្វាយ</option>
                <option value="ផ្កាឈូក.png">ផ្កាឈូក</option>
                <option value="ខៀវ.png">ខៀវ</option>
            </select>
        </div>

        <div class="panel">
            <h3>🖼 Background</h3>

            <input type="file"
                   id="backgroundUpload"
                   accept="image/*">
        </div>

        <div class="panel">
            <h3>📷 Photo</h3>

            <input type="file"
                   id="photoUpload"
                   accept="image/*">
        </div>

        <div class="panel">
            <h3>📝 Certificate Text</h3>

            <input
                type="text"
                id="nameInput"
                placeholder="ឈ្មោះ">

            <textarea
                id="reasonInput"
                rows="4"
                placeholder="មូលហេតុ">
            </textarea>

            <input
                type="text"
                id="groupInput"
                placeholder="ក្រុម">
        </div>

        <div class="panel">
            <h3>📚 Layers</h3>

            <div id="layersPanel"></div>
        </div>

    </aside>

    <!-- CANVAS -->
    <main class="workspace">

        <div id="canvas">

            <img
                id="backgroundImage"
                class="background-image"
                src="បៃតង.png">

            <img
                id="photo"
                class="draggable photo-item">

            <div id="nameText" class="draggable text-item">
                ឈ្មោះអ្នកទទួល
            </div>

            <div id="reasonText" class="draggable text-item">
                មូលហេតុទទួលវិញ្ញាបនបត្រ
            </div>

            <div id="groupText" class="draggable text-item">
                ក្រុម
            </div>

        </div>

    </main>

    <!-- RIGHT PANEL -->
    <aside class="right-panel">

        <!-- FONT MANAGER -->
        <div class="panel">

            <h3>🔤 Font Manager</h3>

            <input
                type="text"
                id="fontSearch"
                placeholder="Search Font">

            <select id="fontFamily">

                <option>Battambang</option>
                <option>Koulen</option>
                <option>Moul</option>

            </select>

            <input
                type="file"
                id="fontUpload"
                accept=".ttf,.otf,.woff,.woff2">

            <button id="favoriteFontBtn">
                ⭐ Favorite
            </button>

            <button id="deleteFontBtn">
                🗑 Delete Font
            </button>

            <div id="fontPreview">
                ការមើល Font ជាមុន
            </div>

        </div>

        <!-- TEXT SETTINGS -->
        <div class="panel">

            <h3>🔧 Text Settings</h3>

            <label>Font Size</label>

            <input
                type="range"
                id="fontSize"
                min="10"
                max="150"
                value="50">

            <label>Text Color</label>

            <input
                type="color"
                id="textColor"
                value="#ffffff">

            <label>Shadow Color</label>

            <input
                type="color"
                id="shadowColor"
                value="#000000">

            <label>
                <input type="checkbox" id="boldText">
                Bold
            </label>

            <label>
                <input type="checkbox" id="italicText">
                Italic
            </label>

        </div>

        <!-- PHOTO -->
        <div class="panel">

            <h3>📷 Photo Settings</h3>

            <label>Photo Size</label>

            <input
                type="range"
                id="photoSize"
                min="80"
                max="600"
                value="180">

            <label>Border Radius</label>

            <input
                type="range"
                id="photoRadius"
                min="0"
                max="100"
                value="10">

        </div>

        <!-- POSITION -->
        <div class="panel">

            <h3>📍 Position</h3>

            <label>X Position</label>

            <input
                type="range"
                id="xPos"
                min="0"
                max="1000">

            <label>Y Position</label>

            <input
                type="range"
                id="yPos"
                min="0"
                max="1400">

        </div>

    </aside>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="app.js"></script>

</body>
</html>
